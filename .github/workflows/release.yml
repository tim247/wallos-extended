name: Release

# Push a tag like v5.11.1-ext.1 to publish:
#  - the Docker image ghcr.io/<owner>/wallos-extended (amd64 + arm64)
#  - a GitHub release with the Proxmox LXC installer files
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/wallos-extended
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha,enable=${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  lxc:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build app archive
        run: |
          mkdir -p dist app
          git archive HEAD | tar -x -C app
          rm -rf app/docker app/lxc app/tests app/.github app/docs app/screenshots
          echo "${GITHUB_REF_NAME}" > app/RELEASE
          tar -czf dist/wallos-extended-app.tar.gz -C app .
          cp lxc/create-lxc.sh lxc/install.sh lxc/update.sh dist/
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
