# Wallos Extended - Start im Ordner "docker":  docker compose up -d --build
services:
  wallos:
    build: .
    image: wallos-extended:latest
    # Das Image gibt es nur lokal: nie aus einer Registry ziehen (Komodo ruft "compose pull" auf)
    pull_policy: build
    container_name: wallos-extended
    ports:
      - "8282:80"
    environment:
      - TZ=Europe/Berlin
    # Daten bleiben bei Updates erhalten (liegen im Ordner ./data)
    volumes:
      - ./data/db:/var/www/html/db
      - ./data/logos:/var/www/html/images/uploads/logos
    restart: unless-stopped
